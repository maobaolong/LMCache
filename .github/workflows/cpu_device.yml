name: Triton CPU original E2E diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      VLLM_MODEL_ID: deepseek-ai/DeepSeek-V2-Lite-Chat
      VLLM_LOAD_FORMAT: dummy
      VLLM_HF_OVERRIDES: '{"num_hidden_layers": 2, "n_routed_experts": 4, "first_k_dense_replace": 0, "num_experts_per_tok": 2}'
      VLLM_TRUST_REMOTE_CODE: '1'
      VLLM_TARBALL_URL: https://github.com/opendataio/deepseek_v2_lite/archive/refs/tags/v1.0.tar.gz
      VLLM_TARBALL_CACHE_MARKER: config.json
      VLLM_MLA_DISABLE: '0'
      LMCACHE_REQUEST_TRANSPORT: zmq
      VLLM_CPU_NIGHTLY_SPEC: vllm-cpu-nightly==0.34.1.dev202611211401
    steps:
      - uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: d2344943b5007293beaa0191098c7a5f5390b3b1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Setup and record hardware
        run: |
          mkdir -p diagnosis
          lscpu | tee diagnosis/lscpu.txt
          gcc --version
          sudo apt-get update -qq
          sudo apt-get install -y gdb ffmpeg
          sudo sysctl -w kernel.core_pattern="$PWD/diagnosis/core.%e.%p"
      - name: Install exact CPU runtime
        run: bash .github/scripts/install_vllm_cpu.sh
      - name: Install LMCache from original PR revision
        run: bash .github/scripts/install_lmcache_cpu.sh
      - name: Reproduce original first request
        env:
          LMCACHE_E2E_TRANSPORT_MODE: inline
          LMCACHE_HTTP_PORT_E2E: '18082'
          LMCACHE_REQUEST_PORT_E2E: '15557'
          VLLM_PORT_E2E: '18000'
          TRITON_KERNEL_DUMP: '1'
          TRITON_DUMP_DIR: ${{ runner.temp }}/triton-dump
        run: |
          ulimit -c unlimited
          sed '/^# Phase 3:/,$d' .github/scripts/run-cpu-e2e-validation.sh > .github/scripts/repro-e2e-first-request.sh
          sed -i 's@run-cpu-e2e-validation.sh@repro-e2e-first-request.sh@' .github/scripts/cpu_vllm_e2e_test.sh
          bash .github/scripts/cpu_device_test.sh vllm_e2e
      - name: Inspect core files
        if: always()
        run: |
          for core in diagnosis/core.*; do
            if [ -f "$core" ]; then
              gdb -batch -ex 'x/16i $pc-24' -ex 'info registers' -ex bt "$(command -v python)" "$core" > "$core.gdb.log" 2>&1 || true
            fi
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cpu-original-e2e-diagnosis-${{ matrix.replica }}
          path: |
            diagnosis/*.txt
            diagnosis/*.log
            /tmp/cpu_device_*.log
            ${{ runner.temp }}/triton-dump/
