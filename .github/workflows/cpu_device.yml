name: Triton CPU SIGILL diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'
      - name: Record hardware and install exact dependencies
        run: |
          mkdir -p diagnosis
          lscpu | tee diagnosis/lscpu.txt
          sudo apt-get update -qq
          sudo apt-get install -y gdb
          pip install torch==2.14.0+cpu numpy --index-url https://download.pytorch.org/whl/cpu
          pip install https://github.com/triton-lang/triton-cpu/releases/download/v3.8.0/triton-3.8.0+cpu-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          pip download --no-deps vllm-cpu-nightly==0.34.1.dev202611211401 -d diagnosis
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile(next(pathlib.Path('diagnosis').glob('*.whl'))) as z:
              z.extract('vllm/v1/worker/gpu/buffer_utils.py', 'diagnosis/source')
          PY
          pip freeze | tee diagnosis/dependencies.txt
      - name: Install vLLM runtime
        run: VLLM_CPU_NIGHTLY_SPEC=vllm-cpu-nightly==0.34.1.dev202611211401 bash .github/scripts/install_vllm_cpu.sh
      - name: Run MLA generation without LMCache under GDB
        run: |
          mkdir -p diagnosis/model
          curl -fsSL --max-time 60 https://github.com/opendataio/deepseek_v2_lite/archive/refs/tags/v1.0.tar.gz | tar xz --strip-components=1 -C diagnosis/model
          export REPRO_MODEL_DIR="$PWD/diagnosis/model"
          export VLLM_TARGET_DEVICE=cpu HF_HUB_OFFLINE=1
          gdb -batch -ex 'set detach-on-fork off' -ex 'set follow-fork-mode child' -ex 'set schedule-multiple on' -ex run -ex 'x/12i $pc-20' -ex 'info registers' -ex 'thread apply all bt' --args python -u .github/scripts/repro_model.py 2>&1 | tee diagnosis/model-gdb.log || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: triton-cpu-diagnosis-${{ matrix.replica }}
          path: |
            diagnosis/*.txt
            diagnosis/*.log
            diagnosis/kernel/
            diagnosis/source/
