# Focused combined qualification: original startup-ready regression and Mamba TP restore.
steps:
- label: ':compression: vllm / hma_dsv4_correctness / grpc'
  command: .buildkite/k3_tests/multiprocess/run.sh hma_dsv4_correctness
  env:
    MODEL: deepseek-ai/DeepSeek-V4-Flash
    INFERENCE_ENGINE: vllm
    LMCACHE_REQUEST_TRANSPORT: grpc
    LMCACHE_MP_TRANSFER_MODE: lmcache_driven
    TENSOR_PARALLEL_SIZE: '1'
    VLLM_LOAD_FORMAT: dummy
    VLLM_HF_OVERRIDES: '{"num_hidden_layers":6,"num_nextn_predict_layers":0,"compress_ratios":[0,0,4,128,4,128]}'
    VLLM_KV_CACHE_DTYPE: fp8_ds_mla
    VLLM_TOKENIZER_MODE: deepseek_v4
    VLLM_ENABLE_EXPERT_PARALLEL: '1'
    VLLM_TRUST_REMOTE_CODE: '1'
    VLLM_MAX_LOGPROBS: '100'
    ATTENTION_BACKEND: auto
    ENFORCE_EAGER: '1'
    BATCH_INVARIANT: '0'
    CPU_BUFFER_SIZE: '40'
    CHUNK_SIZE: '256'
    MAX_MODEL_LEN: '8192'
    MAX_NUM_BATCHED_TOKENS: '8192'
    MAX_NUM_SEQS: '1'
    MAX_TOKENS: '128'
    GPU_MEMORY_UTILIZATION: '0.8'
    MAX_WAIT_SECONDS: '2700'
    LMCACHE_MP_MQ_TIMEOUT: '120'
    VLLM_KV_LOAD_FAILURE_POLICY: fail
    VLLM_DISABLE_PREFIX_CACHING: 'false'
    SEPARATE_OBJECT_GROUPS: '1'
  timeout_in_minutes: 90
  retry:
    automatic:
    - exit_status: -1
      limit: 2
    - exit_status: '*'
      limit: 2
  agents:
    queue: k8s
  plugins:
  - kubernetes:
      podSpec:
        containers:
        - name: container-0
          image: lmcache/ci-base:latest
          imagePullPolicy: Never
          resources:
            limits:
              nvidia.com/gpu: '1'
          volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: hf-cache
          hostPath:
            path: /data/huggingface
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  artifact_paths:
  - '*.log'
  - ci_results_*/hma_dsv4_correctness/**/*
- label: ':compression: {{matrix.inference_engine}} / kimi_linear_tp / {{matrix.request_transport}}'
  command: .buildkite/k3_tests/multiprocess/run.sh kimi_linear_tp
  matrix:
    setup:
      inference_engine:
      - vllm
      request_transport:
      - grpc
  env:
    INFERENCE_ENGINE: '{{matrix.inference_engine}}'
    LMCACHE_REQUEST_TRANSPORT: '{{matrix.request_transport}}'
  timeout_in_minutes: 60
  retry:
    automatic:
    - exit_status: -1
      limit: 2
    - exit_status: '*'
      limit: 2
  agents:
    queue: k8s
  plugins:
  - kubernetes:
      podSpec:
        containers:
        - name: container-0
          image: lmcache/ci-base:latest
          imagePullPolicy: Never
          resources:
            limits:
              nvidia.com/gpu: '2'
          volumeMounts:
          - name: hf-cache
            mountPath: /root/.cache/huggingface
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: hf-cache
          hostPath:
            path: /data/huggingface
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  artifact_paths:
  - '*.log'
  - ci_results_*/kimi_linear_tp/**/*
